[project]
name = "miskatonic-review-authority"
version = "0.1.0"
description = "External verification and independent cloud-review authority for Miskatonic Systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
msk-review-authority = "miskatonic_review_authority.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
