name: Prior Release Verification

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: owner/repository
        required: true
        default: kowen9024AI/miskatonic-control-plane
      base_sha:
        description: Exact base commit SHA
        required: true
      head_sha:
        description: Exact candidate head commit SHA
        required: true
      check_name:
        description: Check-run name
        required: true
        default: miskatonic/prior-release-verify

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ratified authority main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin main
          git checkout --detach FETCH_HEAD

      - name: Prepare GitHub App key and token
        id: app-token
        env:
          MSK_PRIVATE_KEY: ${{ secrets.MSK_REVIEW_APP_PRIVATE_KEY }}
          MSK_REVIEW_APP_ID: ${{ vars.MSK_REVIEW_APP_ID }}
        run: |
          umask 077
          printf '%s' "$MSK_PRIVATE_KEY" > "$RUNNER_TEMP/review-app-private.pem"
          python3 -m miskatonic_review_authority create-app-token \
            --private-key "$RUNNER_TEMP/review-app-private.pem" \
            --owner "${{ github.repository_owner }}" \
            --repository miskatonic-control-plane

      - name: Checkout exact target and prior release
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 -w0)
          git init target
          git -C target remote add origin "https://github.com/$TARGET_REPOSITORY.git"
          git -C target -c http.extraheader="AUTHORIZATION: basic $auth" fetch origin "$HEAD_SHA"
          git -C target checkout --detach FETCH_HEAD
          git init prior-control
          git -C prior-control remote add origin https://github.com/kowen9024AI/miskatonic-control-plane.git
          git -C prior-control -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin 98161a4a9f66420fd293f37cd88473a427585093
          git -C prior-control checkout --detach FETCH_HEAD

      - name: Run prior trusted verifier
        id: verify
        continue-on-error: true
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set +e
          python3 -m miskatonic_review_authority prior-verify \
            --repository "$TARGET_REPOSITORY" \
            --target-path target \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --prior-control-path prior-control \
            --root-record roots/control-plane-v0.1.0.json \
            --policy policy/control-plane-upgrade-v1.json \
            --evidence-out evidence/prior-release.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish authenticated prior-release check
        if: always()
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CHECK_NAME: ${{ inputs.check_name }}
          EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$EXIT_CODE" = "0" ]; then conclusion=success; title="Previous trusted control release verified candidate"; else conclusion=failure; title="Previous trusted control release rejected candidate"; fi
          evidence_arg=""
          if [ -f evidence/prior-release.json ]; then evidence_arg="--evidence evidence/prior-release.json"; fi
          python3 -m miskatonic_review_authority publish-check \
            --repository "$TARGET_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --name "$CHECK_NAME" \
            --conclusion "$conclusion" \
            --title "$title" \
            --summary "Authority workflow run ${{ github.run_id }}" \
            $evidence_arg \
            --details-url "$DETAILS_URL"

      - name: Fail workflow when verification failed
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
