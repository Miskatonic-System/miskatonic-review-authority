name: Independent Cloud Review

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA
        required: true
      head_branch:
        description: Exact PR head branch
        required: true
      head_sha:
        description: Exact candidate head commit SHA
        required: true
      pr_number:
        description: Pull request number
        required: true
      target_policy:
        default: policy/msk-ruliology-scientific-review-v1.json
        description: Authority-owned policy path
        required: true
      target_repository:
        default: Miskatonic-System/msk-ruliology
        description: owner/repository
        required: true

permissions:
  contents: read

env:
  PYTHONPATH: src
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ratified authority main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin main
          git checkout --detach FETCH_HEAD

      - name: Prepare GitHub App key and target-scoped token
        id: app-token
        env:
          MSK_PRIVATE_KEY: ${{ secrets.MSK_REVIEW_APP_PRIVATE_KEY }}
          MSK_REVIEW_APP_ID: ${{ vars.MSK_REVIEW_APP_ID }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          umask 077
          printf '%s' "$MSK_PRIVATE_KEY" > "$RUNNER_TEMP/review-app-private.pem"
          repo_name="${TARGET_REPOSITORY##*/}"
          python3 -m miskatonic_review_authority create-app-token \
            --private-key "$RUNNER_TEMP/review-app-private.pem" \
            --owner "${{ github.repository_owner }}" \
            --repository "$repo_name"

      - name: Checkout exact candidate
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
          HEAD_SHA: ${{ inputs.head_sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 -w0)
          git init target
          git -C target remote add origin "https://github.com/$TARGET_REPOSITORY.git"
          git -C target -c http.extraheader="AUTHORIZATION: basic $auth" fetch origin "$HEAD_SHA" "$BASE_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git -C target checkout --detach "$HEAD_SHA"

      - name: Checkout legacy prior-control if required by policy
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
          TARGET_POLICY: ${{ inputs.target_policy }}
        run: |
          schema=$(python3 -c 'import json; print(json.load(open("'"$TARGET_POLICY"'")).get("schema_version", ""))')
          if [ "$schema" = "prior-verification-policy-v1" ]; then
            auth=$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 -w0)
            git init prior-control
            git -C prior-control remote add origin https://github.com/Miskatonic-System/miskatonic-control-plane.git
            git -C prior-control -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin 98161a4a9f66420fd293f37cd88473a427585093
            GIT_LFS_SKIP_SMUDGE=1 git -C prior-control checkout --detach FETCH_HEAD
          fi

      - name: Verify PR head before review (Stale-head protection)
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          python3 -m miskatonic_review_authority verify-pr-head \
            --token-env GH_APP_TOKEN \
            --repository "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$HEAD_SHA"

      - name: Reproduce prior-release evidence and review packet
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TARGET_POLICY: ${{ inputs.target_policy }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          mkdir -p evidence
          schema=$(python3 -c 'import json; print(json.load(open("'"$TARGET_POLICY"'")).get("schema_version", ""))')
          if [ "$schema" = "scientific-target-policy-v1" ]; then
            python3 -m miskatonic_review_authority prior-verify \
              --repository "$TARGET_REPOSITORY" \
              --target-path target \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --policy "$TARGET_POLICY" \
              --evidence-out evidence/prior-release.json \
              --review-packet-out evidence/review-packet.json \
              --packet-manifest-out evidence/review-packet-manifest.json
          else
            python3 -m miskatonic_review_authority prior-verify \
              --repository "$TARGET_REPOSITORY" \
              --target-path target \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --prior-control-path prior-control \
              --root-record roots/control-plane-v0.1.0.json \
              --policy "$TARGET_POLICY" \
              --evidence-out evidence/prior-release.json
            git -C target diff --no-ext-diff --binary --full-index --find-renames=0 "$BASE_SHA" "$HEAD_SHA" -- > evidence/candidate.diff
          fi

      - name: Prepare signing identity
        run: |
          openssl pkey -in "$RUNNER_TEMP/review-app-private.pem" -pubout -out "$RUNNER_TEMP/review-app-public.pem"
          python3 -m miskatonic_review_authority key-fingerprint --public-key "$RUNNER_TEMP/review-app-public.pem" > "$RUNNER_TEMP/key-id"

      - name: Run independent cloud review
        id: review
        continue-on-error: true
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MSK_CLOUD_REVIEW_API_KEY: ${{ secrets.MSK_CLOUD_REVIEW_API_KEY }}
          MSK_CLOUD_REVIEW_MODEL: ${{ vars.MSK_CLOUD_REVIEW_MODEL }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set +e
          packet_args=""
          if [ -f evidence/review-packet.json ]; then
            packet_args="--review-packet evidence/review-packet.json"
          else
            packet_args="--diff evidence/candidate.diff"
          fi
          python3 -m miskatonic_review_authority review \
            --repository "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-branch "$HEAD_BRANCH" \
            --repo-path target \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --prior-evidence evidence/prior-release.json \
            $packet_args \
            --producer-bindings policy/trusted-producers.json \
            --reviewer-policy policy/trusted-reviewers.json \
            --private-key "$RUNNER_TEMP/review-app-private.pem" \
            --key-id "$(cat "$RUNNER_TEMP/key-id")" \
            --output evidence/review-attestation.json \
            --authority-principal "github-app:miskatonic-review-authority" \
            --workflow-run-id "${{ github.run_id }}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify PR head before publishing check (Stale-head protection)
        if: always()
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          python3 -m miskatonic_review_authority verify-pr-head \
            --token-env GH_APP_TOKEN \
            --repository "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$HEAD_SHA"

      - name: Publish authenticated cloud-review check
        if: always()
        env:
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXIT_CODE: ${{ steps.review.outputs.exit_code }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          conclusion=failure
          title="Independent cloud review unavailable or rejected candidate"
          if [ "$EXIT_CODE" = "0" ] && [ -f evidence/review-attestation.json ]; then
            verdict=$(python3 -c 'import json; print(json.load(open("evidence/review-attestation.json"))["verdict"])')
            rel_auth=$(python3 -c 'import json; print(json.load(open("evidence/review-attestation.json"))["release_authorized"])')
            if [ "$verdict" = "APPROVE" ] && [ "$rel_auth" = "True" ]; then
              conclusion=success
              title="Independent cloud reviewer approved exact candidate"
            else
              conclusion=failure
              title="Independent cloud reviewer requested changes or rejected candidate"
            fi
          fi
          evidence_arg=""
          if [ -f evidence/review-attestation.json ]; then evidence_arg="--evidence evidence/review-attestation.json"; fi
          python3 -m miskatonic_review_authority publish-check \
            --repository "$TARGET_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --name "miskatonic/independent-cloud-review" \
            --conclusion "$conclusion" \
            --title "$title" \
            --summary "Authority workflow run ${{ github.run_id }}" \
            $evidence_arg \
            --details-url "$DETAILS_URL"

      - name: Fail workflow unless exact candidate was approved
        if: steps.review.outputs.exit_code != '0'
        run: exit 1

      - name: Enforce approval verdict
        if: steps.review.outputs.exit_code == '0'
        run: |
          python3 - <<'PY'
          import json
          value = json.load(open('evidence/review-attestation.json'))
          if value['verdict'] != 'APPROVE' or value['release_authorized'] is not True:
              raise SystemExit(1)
          PY
