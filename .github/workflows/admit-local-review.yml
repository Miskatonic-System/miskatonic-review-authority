name: Admit Local Review V2

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target repository (e.g. Miskatonic-System/msk-ruliology)
        required: true
        default: Miskatonic-System/msk-ruliology
      pr_number:
        description: Pull request number
        required: true
      base_sha:
        description: Exact base commit SHA
        required: true
      head_sha:
        description: Exact candidate head commit SHA
        required: true
      target_policy:
        description: Target review policy path
        required: true
        default: policy/targets/msk-ruliology-cra-05y-v2.json
      signed_receipt_b64:
        description: Base64-encoded signed local review receipt JSON
        required: true
      detached_sig_b64:
        description: Base64-encoded detached RSA signature
        required: true
      check_name:
        description: Primary check run name
        required: false
        default: miskatonic/independent-local-review

permissions:
  contents: read

env:
  PYTHONPATH: src
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ratified authority main without external actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin main
          git checkout --detach FETCH_HEAD

      - name: Prepare GitHub App key and target-scoped token
        id: app-token
        env:
          MSK_PRIVATE_KEY: ${{ secrets.MSK_REVIEW_APP_PRIVATE_KEY }}
          MSK_REVIEW_APP_ID: ${{ vars.MSK_REVIEW_APP_ID }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          umask 077
          printf '%s' "$MSK_PRIVATE_KEY" > "$RUNNER_TEMP/review-app-private.pem"
          repo_name="${TARGET_REPOSITORY##*/}"
          python3 -m miskatonic_review_authority create-app-token \
            --private-key "$RUNNER_TEMP/review-app-private.pem" \
            --owner "${{ github.repository_owner }}" \
            --repository "$repo_name"

      - name: Checkout exact candidate target
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
          HEAD_SHA: ${{ inputs.head_sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 -w0)
          git init target
          git -C target remote add origin "https://github.com/$TARGET_REPOSITORY.git"
          git -C target -c http.extraheader="AUTHORIZATION: basic $auth" fetch origin "$HEAD_SHA" "$BASE_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git -C target checkout --detach "$HEAD_SHA"

      - name: Verify PR head before admission (Stale-head protection)
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          python3 -m miskatonic_review_authority verify-pr-head \
            --token-env GH_APP_TOKEN \
            --repository "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$HEAD_SHA"

      - name: Materialize signed receipt and signature
        env:
          RECEIPT_B64: ${{ inputs.signed_receipt_b64 }}
          SIG_B64: ${{ inputs.detached_sig_b64 }}
        run: |
          mkdir -p evidence
          printf '%s' "$RECEIPT_B64" | base64 -d > evidence/local-review-receipt.json
          printf '%s' "$SIG_B64" | base64 -d > evidence/local-review-receipt.json.sig

      - name: Verify receipt and admit under GitHub App authority
        id: admit
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CHECK_NAME: ${{ inputs.check_name }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_POLICY: ${{ inputs.target_policy }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          python3 -m miskatonic_review_authority admit-local-review \
            --receipt evidence/local-review-receipt.json \
            --detached-sig evidence/local-review-receipt.json.sig \
            --repository "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$HEAD_SHA" \
            --expected-base-sha "$BASE_SHA" \
            --target-repo-path target \
            --target-policy "$TARGET_POLICY" \
            --trusted-reviewers-policy policy/trusted-reviewers-v2.1.json \
            --trusted-signers-policy policy/trusted-signers.json \
            --trusted-producers-policy policy/trusted-producers.json \
            --github-app-private-key "$RUNNER_TEMP/review-app-private.pem" \
            --output-attestation evidence/review-attestation.json \
            --publish-check \
            --check-name "$CHECK_NAME" \
            --token-env GH_APP_TOKEN \
            --details-url "$DETAILS_URL"
